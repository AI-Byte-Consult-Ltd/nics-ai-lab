model_id: nics-trading-nano
seed: 42

model:
  d_model: 64
  n_layers: 3
  n_heads: 4
  dropout: 0.1

data:
  window: 96             # bars per input window, on every timeframe
  flat_atr: 0.5          # horizon head: |move| < 0.5 ATR = flat
  use_public: true       # public D1/W1 history (public_candles.csv); --no-public turns it off
  # Every timeframe we have. stride = one sample every N bars, horizon = bars ahead for the label.
  intervals:
    1min:  {stride: 30, horizon: 60}   # where is price 1 hour later
    5min:  {stride: 6,  horizon: 24}   # 2 hours
    15min: {stride: 4,  horizon: 16}   # 4 hours
    1h:    {stride: 1,  horizon: 8}    # 8 hours
    4h:    {stride: 1,  horizon: 6}    # 1 day
    1day:  {stride: 1,  horizon: 5}    # 1 week   (public history)
    1week: {stride: 1,  horizon: 4}    # 1 month  (public history)
  signal_interval: 15min # broker candles used to label every trade setup (TP1 vs SL)
  signal_max_bars: 192   # a setup still open after 48 h has no outcome yet
  split: [0.7, 0.15]     # train / val by time (boundaries from our broker data), rest = test

methods:                 # trading methodologies run on history -> extra labelled setups
  enabled: true          # src/nics/market/methods.py (range both sides, breakout, EMA pullback, level bounce)
  intervals: [1h, 4h]
  cooldown_bars: 6       # at most one setup per method and direction every 6 bars

self_learning:           # scripts/self_learn.py (nightly cycle on the laptop)
  finetune_steps: 1500   # warm-start from the champion with this many steps
  lr_scale: 0.5          # half the learning rate when fine-tuning
  scratch_every_days: 7  # also train a fresh model from random weights once a week
  min_improvement: 0.002 # challenger must beat the champion's test_score by at least this
  keep_snapshots: 3      # older data/market/<date>/ folders are deleted

training:
  batch_size: 64
  max_steps: 3000
  eval_interval: 100
  eval_max_samples: 20000
  checkpoint_interval: 500
  early_stop_evals: 6
  learning_rate: 0.0005
  warmup_steps: 100
  weight_decay: 0.05
  grad_clip: 1.0
  signal_loss_weight: 1.0
  min_signal_samples: 50
  min_filtered_trades: 20

paths:
  experiments_dir: experiments/trading/nics-trading-nano
