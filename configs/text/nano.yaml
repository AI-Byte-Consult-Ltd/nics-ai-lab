model_id: nics-text-nano
seed: 42

model:
  d_model: 128
  n_layers: 4
  n_heads: 4
  max_seq_len: 128
  dropout: 0.0

data:
  corpus: data/raw/tinyshakespeare.txt
  tokenizer_dir: data/processed/tokenizer
  train_split: 0.9

training:
  batch_size: 32
  max_steps: 500
  eval_interval: 50
  eval_iters: 20
  checkpoint_interval: 100
  learning_rate: 0.0003
  warmup_steps: 50
  weight_decay: 0.01
  grad_clip: 1.0

paths:
  experiments_dir: experiments/text/nics-text-nano
