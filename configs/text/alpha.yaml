# NICS Language alpha: the largest size that is still realistic on the laptop CPU.
# Purpose: news digest and steadier three-language output. Starts only after micro passed its checks.
model_id: nics-text-alpha
seed: 42

model:
  vocab_size: 24576
  d_model: 512
  n_layers: 12
  n_heads: 8
  max_seq_len: 2048
  dropout: 0.0
  pos_encoding: rope

data:
  tokenizer: data/processed/language/tokenizer-24k.json
  tokens_dir: data/processed/language/tokens-24k

training:
  batch_size: 8
  block_size: 768
  max_steps: 120000
  eval_interval: 500
  eval_iters: 20
  checkpoint_interval: 500
  learning_rate: 0.0004
  warmup_steps: 2000
  weight_decay: 0.1
  grad_clip: 1.0

paths:
  experiments_dir: experiments/text/nics-text-alpha
