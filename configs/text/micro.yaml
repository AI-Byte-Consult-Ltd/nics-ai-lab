# NICS Language micro: the first working size. Trains on the laptop CPU.
# Purpose: narrow tasks (closed-trade story, signal card texts) first in the Mini App languages
# (ru, en, es, bg, pt). One 24k tokenizer covers all 12 site languages and is shared with alpha,
# so growing the model later never changes the vocabulary or the billing meter.
model_id: nics-text-micro
seed: 42

model:
  vocab_size: 24576
  d_model: 384
  n_layers: 8
  n_heads: 6
  max_seq_len: 1024
  dropout: 0.0
  pos_encoding: rope

data:
  tokenizer: data/processed/language/tokenizer-24k.json
  tokens_dir: data/processed/language/tokens-24k

training:
  batch_size: 16
  block_size: 512
  max_steps: 60000
  eval_interval: 500
  eval_iters: 20
  checkpoint_interval: 500
  learning_rate: 0.0006
  warmup_steps: 1000
  weight_decay: 0.1
  grad_clip: 1.0

paths:
  experiments_dir: experiments/text/nics-text-micro
