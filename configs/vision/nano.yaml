model_id: nics-vision-nano
seed: 42

model:
  in_channels: 1
  image_size: 32
  base_channels: 16
  dropout: 0.1
  num_classes: 10

data:
  raw_dir: data/raw/fashion-mnist

training:
  batch_size: 64
  max_steps: 500
  eval_interval: 50
  eval_iters: 20
  checkpoint_interval: 100
  learning_rate: 0.001
  warmup_steps: 50
  weight_decay: 0.01
  grad_clip: 1.0

paths:
  experiments_dir: experiments/vision/nics-vision-nano
